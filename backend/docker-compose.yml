version: '3.8'

services:
  erp_server:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile.mock
    command: uvicorn mcp_servers.erp_server.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  freight_server:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile.mock
    command: uvicorn mcp_servers.freight_server.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  risk_server:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile.mock
    command: uvicorn mcp_servers.risk_server.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
