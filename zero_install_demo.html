<body class="text-white selection:bg-marine-200 selection:text-marine-100">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;
        const API_URL = "http://localhost:8000";

        // Error Boundary to prevent blank page on uncaught errors
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', {className: "p-8 text-center"},
                        React.createElement('h2', {className: "text-xl font-bold text-red-600 mb-2"}, "Something went wrong"),
                        React.createElement('p', {className: "text-gray-600 mb-4"}, this.state.error?.message || "An unexpected error occurred."),
                        React.createElement('button', {
                            className: "bg-blue-600 text-white px-4 py-2 rounded-lg",
                            onClick: () => this.setState({ hasError: false, error: null })
                        }, "Try Again")
                    );
                }
                return this.props.children;
            }
        }
        // Helper components
        function Icon({ name, className }) {
            const spanRef = useRef(null);
            const kebabName = name ? name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').replace(/([A-Z])(\d)/g, '$1-$2').toLowerCase() : '';
            
            useEffect(() => {
                if (window.lucide && spanRef.current) {
                    try {
                        spanRef.current.innerHTML = `<i data-lucide="${kebabName}" class="${className || ''}"></i>`;
                        window.lucide.createIcons({
                            root: spanRef.current,
                            nameAttr: 'data-lucide'
                        });
                    } catch (e) { console.error("Icon render error:", e); }
                }
            }, [name, kebabName, className]);
            
            return <span ref={spanRef} style={{display: 'inline-flex', alignItems: 'center', justifyContent: 'center'}} className={className}></span>;
        }

        // --- Visualizations ---
        function DashboardChart({ allCases }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;
                const ctx = chartRef.current.getContext('2d');
                
                const dataCounts = {
                    'auto_executed': allCases.filter(c => c.status === 'auto_executed').length,
                    'executed': allCases.filter(c => c.status === 'executed').length,
                    'rejected': allCases.filter(c => c.status === 'rejected').length,
                    'pending': allCases.filter(c => !['auto_executed', 'executed', 'rejected'].includes(c.status)).length,
                };

                if (chartInstance.current) chartInstance.current.destroy();

                Chart.defaults.color = '#bae6fd';
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Auto-Executed', 'Executed (Manual)', 'Rejected', 'Pending Review'],
                        datasets: [{
                            data: [dataCounts.auto_executed, dataCounts.executed, dataCounts.rejected, dataCounts.pending],
                            backgroundColor: ['#0d9488', '#059669', '#e11d48', '#d97706'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right' } }
                    }
                });
            }, [allCases]);

            return (
                <div className="instrument-panel p-6 rounded-xl overflow-hidden">
                    <h3 className="text-sm tracking-widest font-bold font-mono uppercase text-white mb-4 border-b border-marine-700 pb-2">Case Resolutions</h3>
                    <div className="h-64"><canvas ref={chartRef}></canvas></div>
                </div>
            );
        }

        const PORT_COORDS = {
            "CNSHA": [31.2304, 121.4737],
            "USLAX": [33.728, 241.738],
            "USSEA": [47.6062, 237.6679],
            "EGSUZ": [29.9668, 32.5498],
            "CNSZX": [22.5431, 114.0579]
        };

        function RouteMap({ routeOptions, origin, destination }) {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            const org = origin || "Origin";
            const dst = destination || "Destination";

            useEffect(() => {
                if (!mapRef.current) return;
                
                if (mapInstance.current) {
                    mapInstance.current.remove();
                }

                const originCoord = PORT_COORDS[org] || [31.2, 121.4];
                const destCoord = PORT_COORDS[dst] || [33.7, 241.7];

                const map = L.map(mapRef.current, {
                    zoomControl: false,
                    attributionControl: false
                }).fitBounds([originCoord, destCoord], { padding: [50, 50] });

                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    subdomains: 'abcd',
                    maxZoom: 20
                }).addTo(map);

                L.circleMarker(originCoord, {
                    radius: 6, fillColor: "#2dd4bf", color: "#2dd4bf", weight: 2, opacity: 1, fillOpacity: 0.8
                }).addTo(map).bindTooltip(org, { permanent: true, direction: 'right', className: 'bg-transparent border-none text-teal-400 font-bold shadow-none text-sm' });

                L.circleMarker(destCoord, {
                    radius: 6, fillColor: "#2dd4bf", color: "#2dd4bf", weight: 2, opacity: 1, fillOpacity: 0.8
                }).addTo(map).bindTooltip(dst, { permanent: true, direction: 'left', className: 'bg-transparent border-none text-teal-400 font-bold shadow-none text-sm' });

                const latDiff = destCoord[0] - originCoord[0];
                const lngDiff = destCoord[1] - originCoord[1];
                
                const midLat = originCoord[0] + latDiff / 2;
                const midLng = originCoord[1] + lngDiff / 2;

                const origCurvePoints = [];
                for (let t = 0; t <= 1; t += 0.05) {
                    const lat = Math.pow(1-t, 2) * originCoord[0] + 2*(1-t)*t * (midLat + latDiff*0.1) + Math.pow(t, 2) * destCoord[0];
                    const lng = Math.pow(1-t, 2) * originCoord[1] + 2*(1-t)*t * (midLng - lngDiff*0.1) + Math.pow(t, 2) * destCoord[1];
                    origCurvePoints.push([lat, lng]);
                }
                L.polyline(origCurvePoints, {
                    color: '#ef4444', weight: 2, dashArray: '5, 5'
                }).addTo(map);

                const bounds = map.getBounds();
                const mapWidth = bounds.getEast() - bounds.getWest();
                const radiusDegrees = mapWidth * 0.03; 
                
                const disruptionCenterLat = (origCurvePoints[10][0] + origCurvePoints[11][0])/2;
                const disruptionCenterLng = (origCurvePoints[10][1] + origCurvePoints[11][1])/2;
                
                L.circle([disruptionCenterLat, disruptionCenterLng], {
                    radius: radiusDegrees * 111000,
                    color: '#ef4444', weight: 2, fillColor: '#ef4444', fillOpacity: 0.1
                }).addTo(map);
                L.circle([disruptionCenterLat, disruptionCenterLng], {
                    radius: radiusDegrees * 111000 * 0.4,
                    color: '#ef4444', weight: 1, fill: false
                }).addTo(map);

                routeOptions.forEach((r, i) => {
                    const color = i === 0 ? "#f97316" : (i === 1 ? "#eab308" : "#a855f7");
                    const offset = (i + 1) * 0.2; 
                    const perpLat = -lngDiff;
                    const perpLng = latDiff;
                    const curveMidLat = midLat + perpLat * offset;
                    const curveMidLng = midLng + perpLng * offset;

                    const curvePoints = [];
                    for (let t = 0; t <= 1; t += 0.05) {
                        const lat = Math.pow(1-t, 2) * originCoord[0] + 2*(1-t)*t * curveMidLat + Math.pow(t, 2) * destCoord[0];
                        const lng = Math.pow(1-t, 2) * originCoord[1] + 2*(1-t)*t * curveMidLng + Math.pow(t, 2) * destCoord[1];
                        curvePoints.push([lat, lng]);
                    }

                    L.polyline(curvePoints, {
                        color: color, weight: 2, dashArray: '4, 4', opacity: 0.9
                    }).addTo(map);
                });

                mapInstance.current = map;

                return () => {
                    if (mapInstance.current) {
                        mapInstance.current.remove();
                        mapInstance.current = null;
                    }
                };
            }, [routeOptions, origin, destination]);

            return (
                <div className="bg-marine-950 rounded-2xl border border-marine-900 shadow-soft overflow-hidden relative mb-6" style={{height: "350px"}}>
                    <div className="absolute top-0 left-0 w-full p-4 flex justify-between items-start z-[1000] pointer-events-none">
                        <div>
                            <div className="text-teal-400 text-xs font-bold tracking-widest mb-1 shadow-black drop-shadow-md">LIVE GEOSPATIAL</div>
                            <h2 className="text-white text-lg font-bold shadow-black drop-shadow-md">Vessel network</h2>
                        </div>
                        <div className="flex flex-col gap-2 text-xs text-marine-600 bg-marine-950/80 p-3 rounded-xl backdrop-blur-sm border border-marine-800 pointer-events-auto">
                            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-teal-400"></div> Port</div>
                            <div className="flex items-center gap-2"><div className="w-4 h-0.5 bg-red-500 border border-dashed border-red-500"></div> Blocked Route</div>
                            {routeOptions.map((r, i) => (
                                <div key={i} className="flex items-center gap-2">
                                    <div className="w-4 h-0.5 border border-dashed" style={{borderColor: i === 0 ? "#f97316" : (i === 1 ? "#eab308" : "#a855f7")}}></div> {r.carrier}
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <div ref={mapRef} className="w-full h-full z-0"></div>

                    <div className="absolute bottom-0 left-0 w-full p-3 border-t border-marine-800 bg-marine-950/80 backdrop-blur-sm flex items-center text-xs text-marine-500 z-[1000]">
                        <div className="w-2 h-2 rounded-full bg-teal-400 mr-2 shadow-[0_0_8px_#2dd4bf]"></div>
                        <span>{routeOptions.length + 1} routes tracked</span>
                        <span className="mx-3 text-marine-300">|</span>
                        <span>Updated just now</span>
                    </div>
                </div>
            );
        }

        function RouteComparisonChart({ routeOptions }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !routeOptions || routeOptions.length === 0) return;
                const ctx = chartRef.current.getContext('2d');

                const labels = routeOptions.map(r => r.carrier);
                const costs = routeOptions.map(r => r.cost);
                const times = routeOptions.map(r => r.transit_time_days);

                if (chartInstance.current) chartInstance.current.destroy();

                Chart.defaults.color = '#bae6fd';
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Cost (USD)',
                                data: costs,
                                backgroundColor: '#082f49',
                                yAxisID: 'y'
                            },
                            {
                                label: 'Transit Time (Days)',
                                data: times,
                                backgroundColor: '#eab308',
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Cost' } },
                            y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Days' } }
                        }
                    }
                });
            }, [routeOptions]);

            return (
                <div className="instrument-panel p-6 rounded-xl overflow-hidden mt-6">
                    <h3 className="text-sm tracking-widest font-bold font-mono uppercase text-white mb-4 border-b border-marine-700 pb-2">Route Comparison</h3>
                    <div className="h-64"><canvas ref={chartRef}></canvas></div>
                </div>
            );
        }

        function StepTracker({ status, riskTier }) {
            const steps = [
                { key: "ingest", label: "Signal Ingested", active: true },
                { key: "context", label: "Context Gathered", active: !["created", "context_gathering"].includes(status) },
                { key: "routes", label: "Routes Generated", active: !["created", "context_gathering", "ready_for_routing"].includes(status) },
                { key: "tier", label: "Tiered Autonomy Check", active: !["created", "context_gathering", "ready_for_routing", "routes_ready"].includes(status) },
            ];

            let finalStep = { key: "exec", label: "Auto-Executed", active: status === "auto_executed", color: "green" };
            
            if (riskTier === "high" || ["awaiting_approval", "approved", "rejected", "executed"].includes(status)) {
                if (status === "awaiting_approval") finalStep = { key: "exec", label: "Awaiting Approval", active: true, color: "amber" };
                else if (status === "rejected") finalStep = { key: "exec", label: "Rejected", active: true, color: "red" };
                else if (["approved", "executed"].includes(status)) finalStep = { key: "exec", label: "Executed (Approved)", active: true, color: "purple" };
                else finalStep = { key: "exec", label: "Pending Review", active: false, color: "gray" };
            }

            const allSteps = [...steps, finalStep];

            return (
                <div className="flex items-center justify-between min-w-[600px] py-4">
                    {allSteps.map((step, idx) => {
                        const isLast = idx === allSteps.length - 1;
                        const colorClass = step.active ? (step.color === 'amber' ? 'bg-brass-500' : step.color === 'red' ? 'bg-coral-500' : step.color === 'purple' ? 'bg-marine-500' : 'bg-teal-500') : 'bg-marine-700';
                        const textColor = step.active ? 'text-white font-bold font-mono tracking-wide' : 'text-marine-400 font-mono tracking-wide';
                        
                        return (
                            <div key={step.key} className="flex items-center flex-1 last:flex-none">
                                <div className="flex flex-col items-center relative z-10 w-32">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${colorClass} text-white shadow-inner-soft border-2 ${step.active ? 'border-transparent' : 'border-marine-600'} transition-colors duration-500`}>
                                        {step.active && step.key !== 'exec' ? <Icon name="Flag" className="w-5 h-5" /> : (idx + 1)}
                                    </div>
                                    <span className={`text-xs mt-3 text-center uppercase transition-colors duration-500 ${textColor}`}>
                                        {step.label}
                                    </span>
                                </div>

                function App() {
            const [view, setView] = useState("dashboard");
            const [activeThread, setActiveThread] = useState(null);
            const [trackedThreads, setTrackedThreads] = useState(() => JSON.parse(localStorage.getItem('trackedThreads') || '[]'));
            const [pendingCases, setPendingCases] = useState([]);
            const [allCases, setAllCases] = useState([]);
            
            const trackedRef = React.useRef(trackedThreads);
            useEffect(() => { trackedRef.current = trackedThreads; }, [trackedThreads]);

            const saveTracked = (id) => {
                setTrackedThreads(prev => {
                    if (prev.includes(id)) return prev;
                    const updated = [...prev, id];
                    localStorage.setItem('trackedThreads', JSON.stringify(updated));
                    return updated;
                });
            };

            const pollPending = async () => {
                try {
                    const res = await fetch(`${API_URL}/cases/pending-approval`);
                    if (res.ok) {
                        const data = await res.json();
                        setPendingCases(data.pending_cases || []);
                        data.pending_cases?.forEach(c => saveTracked(c.thread_id));
                    }
                } catch (e) { console.error(e); }
            };

            const pollAll = async () => {
                const threads = trackedRef.current;
                if (threads.length === 0) return;
                try {
                    const results = await Promise.all(
                        threads.map(id => fetch(`${API_URL}/cases/${id}`).then(r => r.ok ? r.json() : null).catch(() => null))
                    );
                    const valid = results.filter(Boolean).map(c => ({ thread_id: c.thread_id, next: c.next || [], ...c.state }));
                    setAllCases(valid.reverse());
                } catch (e) { console.error(e); }
            };

            useEffect(() => {
                pollPending();
                pollAll();
                const int1 = setInterval(pollPending, 3000);
                const int2 = setInterval(pollAll, 3000);
                return () => { clearInterval(int1); clearInterval(int2); };
            }, []);

            const navigate = (newView, threadId = null) => {
                setView(newView);
                if (threadId) setActiveThread(threadId);
            };

            return (
                <div className="min-h-screen flex flex-col fade-in">

                                <button onClick={() => navigate("approvals")} className={`transition-colors hover:text-white uppercase flex items-center gap-2 ${view === 'approvals' ? 'text-brass-400 font-bold' : 'text-marine-200'}`}>

                                    <h2 className="text-lg font-bold font-mono uppercase tracking-wide text-brass-900 mb-4 flex items-center gap-2"><Icon name="Siren" className="w-5 h-5 text-brass-600 animate-pulse" /> Human Review Req.</h2>
                                    <div className="space-y-4">
                                        <button onClick={() => handleApprove(0)} className="w-full bg-gradient-to-b from-brass-400 to-brass-600 hover:from-brass-500 hover:to-brass-700 text-white font-bold font-mono tracking-widest uppercase py-3 px-4 rounded shadow-instrument transition-colors flex items-center justify-center gap-2">
                                            <Icon name="CheckCircle" className="w-4 h-4" /> Approve Recommended
                                        </button>
                                        <button onClick={handleReject} className="w-full bg-marine-900 border-2 border-coral-200 text-coral-600 hover:bg-coral-900/30 hover:border-coral-300 font-bold font-mono tracking-widest uppercase py-2.5 px-4 rounded shadow-sm transition-colors flex items-center justify-center gap-2">
                                            <Icon name="XCircle" className="w-4 h-4" /> Reject Reroute
                                        </button>
                                    </div>
                                </section>
                            )}

                            {execution && (
                                <section className="instrument-panel rounded-xl p-6 border-t-4 border-t-sea-500 bg-gradient-to-b from-sea-900/40 to-marine-900">
                                    <div className="flex items-center gap-2 text-sea-800 font-bold font-mono uppercase tracking-wide mb-4"><Icon name="Flag" className="w-5 h-5" /> Booking Confirmed</div>
                                    <div className="space-y-3 text-sm font-mono text-white">
                                        <div className="flex justify-between border-b border-sea-200/50 pb-2"><span className="text-sea-700">BOOKING ID:</span> <span className="font-bold">{execution.booking_id}</span></div>
                                        <div className="flex justify-between border-b border-sea-200/50 pb-2"><span className="text-sea-700">CARRIER:</span> <span className="font-bold">{execution.confirmed_carrier}</span></div>
                                        <div className="flex justify-between"><span className="text-sea-700">COST:</span> <span className="font-bold">USD {execution.confirmed_cost_usd?.toLocaleString()}</span></div>
                                    </div>
                                </section>
                            )}

                            {displayStatus === "rejected" && (
                                <section className="bg-red-50 rounded-xl shadow-sm border border-red-200 p-6">
                                    <div className="flex items-center gap-2 text-red-800 font-semibold mb-3"><Icon name="XCircle" className="w-5 h-5" /> Reroute Rejected</div>
                                    <p className="text-sm text-red-900">The recommended reroute was rejected. No booking was created.</p>
                                </section>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Approvals({ pendingCases, navigate }) {
            return (
                <div className="space-y-6 fade-in max-w-4xl mx-auto">
                    <h1 className="text-2xl font-bold font-mono text-white uppercase tracking-widest flex items-center gap-2"><Icon name="Timer" className="w-6 h-6 text-brass-500 animate-pulse" /> Approvals Queue</h1>
                    {pendingCases.length === 0 ? (
                        <div className="p-12 instrument-panel rounded-xl text-center text-marine-400 shadow-soft border-t-4 border-t-sea-500 bg-sea-900/30/20">
                            <Icon name="Flag" className="w-12 h-12 mx-auto text-sea-400 mb-3" />
                            <p className="font-mono text-sm uppercase tracking-widest font-bold">All Clear. No Pending Approvals.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {pendingCases.map(c => (
                                <div key={c.thread_id} className="instrument-panel p-6 rounded-xl border border-brass-700 shadow-soft flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-l-4 border-l-brass-500 bg-gradient-to-r from-brass-50/30 to-marine-900 hover:-translate-y-1 transition-transform">
                                    <div>
                                        <div className="font-bold font-mono text-xl text-white flex items-center gap-2">
                                            <Icon name="Anchor" className="w-5 h-5 text-brass-500" /> {c.shipment_id}
                                        </div>
                                        <div className="text-sm font-mono text-marine-300 mt-2 uppercase tracking-wide">
                                            Rec. Route Cost: <span className="font-bold text-marine-100">USD {c.recommended_cost}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => navigate("case", c.thread_id)} className="bg-gradient-to-b from-brass-400 to-brass-600 hover:from-brass-500 hover:to-brass-700 text-white px-6 py-2.5 rounded shadow-instrument font-bold font-mono uppercase tracking-widest transition-colors flex items-center gap-2 justify-center">
                                        Review <Icon name="ArrowRight" className="w-4 h-4" />
                                    </button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
